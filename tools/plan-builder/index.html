<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Plan Builder</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 12px; }
    .task-card { border: 1px solid #8fa3ff; background: #e4e9ff; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
    .slot-card { border: 1px solid #a8b7ff; background: #eef2ff; border-radius: 6px; padding: 10px; margin-bottom: 10px; }
    .location { border: 1px solid #c1caf5; background: #f6f8ff; border-radius: 4px; padding: 8px; margin-bottom: 8px; }
    .row { margin-bottom: 6px; }
    label { display: inline-block; min-width: 120px; }
    input, select, button { padding: 4px 6px; }
    pre { background: #f8f8f8; padding: 8px; border: 1px solid #eee; }
  </style>
</head>
<body>
  <h3>Материал</h3>
  <div id="tasks"></div>
  <button id="addTask">+ Товар</button>

  <div style="margin-top:12px;">
    <div id="warn" style="color:#c00; margin-top:6px;"></div>
    <pre id="output"></pre>
    <button id="download" style="margin-top:8px;">Скачать plan.json</button>
  </div>

  <script>
    const materials = [
      { id: 'karier_neseyan_nemyt_pesok', name: 'Песок карьерный несеяный немытый' },
      { id: 'karier_seyan_nemyt_pesok', name: 'Песок карьерный сеяный немытый' },
      { id: 'karier_seyan_myt_pesok_1.5', name: 'Песок карьерный сеяный мытый (мелкий 1.5)' },
      { id: 'karier_seyan_myt_pesok_2', name: 'Песок карьерный сеяный мытый (средний 2)' },
      { id: 'karier_seyan_myt_pesok_2.5', name: 'Песок карьерный сеяный мытый (крупный 2.5)' }
    ];
    const locations = [
      { name: 'Бронницы, Магистральная ул., 3' },
      { name: 'Чехов, ул. Чехова, 20Бк5' },
      { name: 'Подольск, ул. Лапшенкова, 3' },
      { name: 'Троицк, Индустриальная ул., 1' },
      { name: 'Домодедово, Станционная ул., 26к3' }
    ];

    const tasksDiv = document.getElementById('tasks');
    const addTaskBtn = document.getElementById('addTask');
    const outputPre = document.getElementById('output');
    const downloadBtn = document.getElementById('download');
    const warnDiv = document.getElementById('warn');

    function formatDate(val) {
      if (!val) return '';
      const [datePart, timePart] = val.split('T');
      if (!datePart || !timePart) return val;
      const [y, m, d] = datePart.split('-').map(Number);
      if (!y || !m || !d) return val;
      const [hh = '00', mm = '00'] = timePart.split(':');
      const pad = (n) => String(n).padStart(2, '0');
      return `${pad(d)}.${pad(m)}.${y} ${pad(hh)}:${pad(mm)}`;
    }

    function distributeCounts(slotDiv) {
      const total = parseInt(slotDiv.querySelector('.slot-count').value, 10) || 0;
      if (!total) return;
      const locs = Array.from(slotDiv.querySelectorAll('.location'));
      const eligible = locs;
      if (!eligible.length) return;
      const autoTargets = eligible.filter((loc) => !loc.querySelector('.loc-value').dataset.user);
      if (!autoTargets.length) return;
      const base = Math.floor(total / eligible.length);
      let rem = total - base * eligible.length;
      eligible.forEach((loc) => {
        const valInput = loc.querySelector('.loc-value');
        if (!valInput.dataset.user) {
          const val = base + (rem > 0 ? 1 : 0);
          valInput.value = val;
          if (rem > 0) rem -= 1;
        }
      });
    }

    function createLocationRow(slotDiv) {
      const div = document.createElement('div');
      div.className = 'location';
      div.innerHTML = `
        <div class="row">
          <label>Адрес:</label>
          <select class="loc-address">
            ${locations.map(l => `<option value="${l.name}">${l.name}</option>`).join('')}
          </select>
        </div>
        <div class="row">
          <label>Значение:</label>
          <input type="number" class="loc-value" min="0" value="0" />
        </div>
        <button class="removeLoc">Удалить</button>
      `;
      const valueInput = div.querySelector('.loc-value');
      valueInput.addEventListener('input', () => {
        if (valueInput.value) valueInput.dataset.user = '1';
      });
      div.querySelector('.removeLoc').onclick = () => {
        div.remove();
        distributeCounts(slotDiv);
      };
      return div;
    }

    function createSlot() {
      const div = document.createElement('div');
      div.className = 'slot-card';
      div.innerHTML = `
        <div class="row">
          <label>Дата/время:</label>
          <input type="datetime-local" class="slot-date" step="60" />
        </div>
        <div class="row">
          <label>Count:</label>
          <input type="number" class="slot-count" min="1" value="10" />
        </div>
        <div class="loc-container"></div>
        <button class="addLoc">+ Локация</button>
        <button class="removeSlot">Удалить слот</button>
      `;
      const locContainer = div.querySelector('.loc-container');
      const addLocBtn = div.querySelector('.addLoc');
      addLocBtn.onclick = () => {
        const row = createLocationRow(div);
        locContainer.appendChild(row);
        distributeCounts(div);
        updateOutput();
      };
      div.querySelector('.removeSlot').onclick = () => div.remove();
      // по умолчанию одна локация
      locContainer.appendChild(createLocationRow(div));
      distributeCounts(div);
      // автораспределение при изменении total count
      div.querySelector('.slot-count').addEventListener('input', () => distributeCounts(div));
      return div;
    }

    function createTask() {
      const div = document.createElement('div');
      div.className = 'task-card';
      div.innerHTML = `
        <div class="row">
          <label>Товар:</label>
          <select class="task-material">
            ${materials.map(m => `<option value="${m.id}">${m.name}</option>`).join('')}
          </select>
        </div>
        <div class="slots"></div>
        <button class="addSlot">+ Слот</button>
        <button class="removeTask">Удалить товар</button>
      `;
      const slotsContainer = div.querySelector('.slots');
      const addSlot = div.querySelector('.addSlot');
      addSlot.onclick = () => {
        const slot = createSlot();
        slotsContainer.appendChild(slot);
        distributeCounts(slot);
        updateOutput();
      };
      div.querySelector('.removeTask').onclick = () => {
        div.remove();
        updateOutput();
      };
      // первый слот по умолчанию
      slotsContainer.appendChild(createSlot());
      return div;
    }

    addTaskBtn.onclick = () => {
      tasksDiv.appendChild(createTask());
      updateOutput();
    };
    // начальный товар
    tasksDiv.appendChild(createTask());

    function buildPlan() {
      const taskNodes = tasksDiv.querySelectorAll('.task-card');
      const plan = { tasks: [] };
      taskNodes.forEach(task => {
        const materialId = task.querySelector('.task-material').value;
        const slotNodes = task.querySelectorAll('.slots > .slot-card');
        const slots = [];
        slotNodes.forEach(slot => {
          const dateRaw = slot.querySelector('.slot-date').value || '';
          const date = formatDate(dateRaw);
          const count = parseInt(slot.querySelector('.slot-count').value, 10) || 0;
          const locs = [];
          slot.querySelectorAll('.location').forEach(loc => {
            const addr = loc.querySelector('.loc-address').value;
            const val = parseInt(loc.querySelector('.loc-value').value, 10) || 0;
            if (val > 0) {
              locs.push({ address: addr, count: val });
            }
          });
          slots.push({ DateBegin: date, count, locations: locs });
          distributeCounts(slot);
        });
        plan.tasks.push({ material: 'sand', materialId, slots });
      });
      return plan;
    }

    function validatePlan(plan) {
      if (!plan || !plan.tasks) return { valid: false, message: 'План пустой' };
      for (const task of plan.tasks) {
        for (const slot of task.slots || []) {
          const total = Number(slot.count) || 0;
          if (!total) return { valid: false, message: 'Не заполнен count в слоте' };
          let sumCount = 0;
          (slot.locations || []).forEach((loc) => {
            sumCount += Number(loc.count) || 0;
          });
          if (sumCount > total) {
            return { valid: false, message: `Локации превышают count: ${sumCount} > ${total}` };
          }
        }
      }
      return { valid: true, message: '' };
    }

    function updateOutput() {
      const plan = buildPlan();
      const validation = validatePlan(plan);
      warnDiv.textContent = validation.message;
      downloadBtn.disabled = !validation.valid;
      outputPre.textContent = JSON.stringify(plan, null, 2);
      return plan;
    }

    tasksDiv.addEventListener('input', updateOutput);
    updateOutput();

    downloadBtn.onclick = () => {
      const plan = updateOutput();
      const blob = new Blob([JSON.stringify(plan, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'plan.json';
      a.click();
      URL.revokeObjectURL(url);
    };
  </script>
</body>
</html>
