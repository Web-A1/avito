[package]
name = "feed-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
once_cell = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
calamine = "0.32.0"
quick-xml = "0.38.4"
