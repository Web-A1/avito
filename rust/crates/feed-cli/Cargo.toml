[package]
name = "feed-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.53", features = ["derive"] }
dotenvy = "0.15.7"
feed-core = { path = "../feed-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tempfile = "3.12.0"

[[bin]]
name = "feed-cli"
path = "src/main.rs"
